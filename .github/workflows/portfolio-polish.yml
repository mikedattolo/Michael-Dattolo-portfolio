name: Final portfolio reference check
on:
  push:
    branches: [portfolio-rebuild-2026-09-21]
    paths: ['.github/workflows/portfolio-polish.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-rebuild-2026-09-21
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve moved primary reference only when its content matches
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request
          old='https://www.jwu.edu/news/stories/magazine/2022/fall/design/index.html'
          candidates=['https://www.jwu.edu/all-news/form-follows-function/','https://www3.jwu.edu/news/stories/magazine/2022/fall/design/index.html','https://inquire.jwu.edu/news/stories/magazine/2022/fall/design/index.html']
          results=[];selected=None
          for url in candidates:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Portfolio Link Review'}),timeout=12) as r:
                      text=r.read().decode('utf-8',errors='replace')
                      matched=r.status==200 and 'Form Follows Function' in text and 'Dattolo' in text and 'throttle' in text
                      results.append({'url':url,'status':r.status,'content_matches_original_article':matched,'resolved_url':r.url})
                      if matched:selected=r.url;break
              except Exception as e:results.append({'url':url,'error':str(e)})
          Path('qa-output').mkdir(exist_ok=True)
          Path('qa-output/reference-resolution.json').write_text(json.dumps({'selected':selected,'checks':results},indent=2))
          print(json.dumps({'selected':selected,'checks':results},indent=2))
          assert selected,'No verified replacement; stop rather than publish a guessed source URL.'
          p=Path('content/projects.json');text=p.read_text();assert text.count(old)==1;p.write_text(text.replace(old,selected))
          PY
          npm run build && npm test
      - name: Commit the verified reference update on review branch only
        run: |
          test "$GITHUB_REF" = "refs/heads/portfolio-rebuild-2026-09-21"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects.json
          git commit -m "Update pipetting article to verified working university URL"
          git push origin HEAD:portfolio-rebuild-2026-09-21
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test final preview without deployment
        run: python tests/browser.py
      - name: Record public reference availability
        if: always()
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          projects=json.loads(Path('content/projects.json').read_text());site=json.loads(Path('content/site.json').read_text())
          urls=sorted({r['href'] for p in projects for r in p['references']}|{r['href'] for r in site['research']}|{site['linkedin']})
          def check(url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Portfolio Link Review'}),timeout=12) as r:return {'url':url,'status':r.status,'resolved_url':r.url}
              except Exception as e:return {'url':url,'error':str(e)}
          out=Path('qa-output');out.mkdir(exist_ok=True)
          results=list(ThreadPoolExecutor(max_workers=8).map(check,urls));(out/'external-availability.json').write_text(json.dumps(results,indent=2));print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-release-preview
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-release-qa
          path: qa-output/
          retention-days: 14
