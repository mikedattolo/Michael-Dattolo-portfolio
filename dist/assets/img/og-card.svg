<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc46b"/>
      <stop offset="0.5" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#ff5436"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.18" cy="0.1" r="1">
      <stop offset="0" stop-color="#1a1620"/>
      <stop offset="0.5" stop-color="#0d0d11"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="150" cy="80" rx="520" ry="420" fill="url(#glow)"/>
  <ellipse cx="1120" cy="600" rx="420" ry="360" fill="url(#glow)" opacity="0.6"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M90 0V630M180 0V630M270 0V630M360 0V630M450 0V630M540 0V630M630 0V630M720 0V630M810 0V630M900 0V630M990 0V630M1080 0V630"/>
  </g>

  <!-- brand mark -->
  <rect x="90" y="86" width="74" height="74" rx="20" fill="url(#g)"/>
  <text x="127" y="138" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="44" font-weight="700" fill="#1a0a02">M</text>

  <!-- eyebrow -->
  <text x="92" y="300" font-family="ui-monospace, Menlo, monospace" font-size="22" letter-spacing="6" fill="#ffb15c">PRODUCT DESIGNER · ROBOTICIST · INNOVATOR</text>

  <!-- name -->
  <text x="88" y="392" font-family="'Space Grotesk', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#ffffff">Michael Dattolo</text>

  <!-- tagline -->
  <text x="92" y="452" font-family="'Inter', Arial, sans-serif" font-size="30" fill="#b6b6c0"><tspan>From rough constraint to </tspan><tspan fill="#ff8a4d" font-weight="600">validated prototype.</tspan></text>

  <!-- footer line -->
  <rect x="92" y="520" width="56" height="4" rx="2" fill="url(#g)"/>
  <text x="92" y="566" font-family="ui-monospace, Menlo, monospace" font-size="24" letter-spacing="2" fill="#85858f">mike-dattolo.com</text>
  <text x="1108" y="566" text-anchor="end" font-family="'Inter', Arial, sans-serif" font-size="22" fill="#85858f">Manufacturing · Robotics · Medical · AI</text>
