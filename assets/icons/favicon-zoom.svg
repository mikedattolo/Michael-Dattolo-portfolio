<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Michael Dattolo favicon">
  <defs>
    <clipPath id="clip">
      <rect x="0" y="0" width="64" height="64" rx="10" ry="10" />
    </clipPath>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="10" ry="10" fill="#0a0a0a" />
  <image
    href="./favicon.png"
    x="-12"
    y="-12"
    width="88"
    height="88"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#clip)"
  />
</svg>
